name: Heavy Resource Tests

on:
  workflow_dispatch:
    inputs:
      run_high_resource_tests:
        description: Run high-resource tests
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  heavy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run heavy tests
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_high_resource_tests == 'true' }}
        run: |
          # Replace with your actual heavy test command
          pytest -m "heavy_resource" -q
