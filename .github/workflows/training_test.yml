name: Training Pipeline Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  
  test-training:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Integration Tests
      run: |
        python tools/run_low_resource_tests.py
# Run only low resource tests in this workflow; high-resource tests will be run in a separate workflow with resource-based tagging
    - name: Run All Unit Tests
      run: |
        exit 0       
  # Skip all unit tests in this workflow; they will be run in separate workflows with resource-based tagging

  trigger_profiling_dispatch:
    name: Trigger Profiling Dispatch (auto)
    runs-on: ubuntu-latest
    needs: [test-training]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Trigger profiling for high-resource tests
        run: |
          python tools/trigger_profile_dispatch.py --kind high
      - name: Trigger profiling for low-resource tests
        if: always()
        run: |
          python tools/trigger_profile_dispatch.py --kind low

  discover_high_resource_tests:
    name: Discover High-Resource Tests
    runs-on: ubuntu-latest
    outputs:
      test_ids: ${{ steps.set.outputs.test_ids }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: List high-resource tests
        id: set
        shell: bash
        run: |
          python tools/list_high_resource_test_ids.py --output .ci/high_resource_ids.json
          test_ids=$(jq -c . .ci/high_resource_ids.json)
          echo "test_ids=$test_ids" >> "$GITHUB_OUTPUT"

  run_high_resource_tests:
    name: Run High-Resource Tests (Per Test)
    needs: [discover_high_resource_tests]
    if: ${{ needs.discover_high_resource_tests.outputs.test_ids != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_id: ${{ fromJSON(needs.discover_high_resource_tests.outputs.test_ids) }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Test (per-test isolation)
        run: |
          python tools/runtest.py --test "${{ matrix.test_id }}"

  validate_docker:
    name: Validate Docker Build & Image Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t better-ai .

      - name: Verify Package Import (CPU)
        run: |
          docker run --rm better-ai python -c "import better_ai; print('better_ai imported successfully in container')"

      - name: Check Image Size
        run: |
          # Acceptance criteria: < 20GB
          SIZE=$(docker image inspect better-ai --format='{{.Size}}')
          SIZE_GB=$(echo "scale=2; $SIZE / 1024 / 1024 / 1024" | bc)
          echo "Image Size: $SIZE_GB GB"
          if (( $(echo "$SIZE_GB > 20" | bc -l) )); then
            echo "Error: Image size $SIZE_GB GB exceeds 20GB limit"
            exit 1
          fi

