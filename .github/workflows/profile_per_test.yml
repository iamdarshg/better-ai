name: Profile Per Test (Triggered by Repository Dispatch)

on:
  repository_dispatch:
    types: [ profile_high_resource, profile_low_resource ]

jobs:
  profile_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py-spy
      - name: Run profiling for test
        run: |
          TEST_ID=${{ github.event.client_payload.test_id }}
          echo "Profiling test: $TEST_ID"
          if [[ -z "$TEST_ID" ]]; then
            echo "No test_id provided; exiting"; exit 0
          fi
          python tools/profile_high_resource_tests.py --single-test "$TEST_ID"
      - name: Upload flame graph
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: flame-graph-${{ github.event.event_type }}
          path: tests/profiles/**/high_resource/*.svg
