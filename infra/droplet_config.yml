# DigitalOcean GPU Droplet Configuration for Better AI

droplet:
  # Recommended GPU Slugs:
  # - gpu-h100x1-80gb: Single H100 (80GB VRAM) - Best for high-performance inference/SFT
  # - gpu-h100x8-640gb: Multi-GPU (8 H100s) - Required for full-scale training
  size: "gpu-h100x1-80gb"

  # Recommended Regions (GPU availability varies):
  # - nyc3 (New York)
  # - sfo3 (San Francisco)
  # - tor1 (Toronto)
  region: "nyc3"

  # Image: Ubuntu 22.04 LTS is required for the provisioning script
  image: "ubuntu-22-04-x64"

  # Recommended Tags for organization
  tags:
    - "better-ai"
    - "gpu-training"

storage:
  # Recommended: Use a separate block storage volume for /app/checkpoints
  # This allows you to persist models even if the Droplet is destroyed.
  volume_size_gb: 100
  mount_path: "/app/checkpoints"

networking:
  # Ensure your SSH key is added to DigitalOcean
  ssh_keys:
    - "YOUR_SSH_KEY_ID_OR_FINGERPRINT"

requirements:
  # Minimum specs for stable training/inference
  min_vram: "80GB"
  min_disk: "100GB"
